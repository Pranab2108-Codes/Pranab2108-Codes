<svg width="260" height="64" viewBox="0 0 260 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation"
          values="3;3;12;12;3;3" keyTimes="0;0.35;0.45;0.8;0.9;1" dur="2.6s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B36A00"/>
      <stop offset="100%" stop-color="#FFA116"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="248" height="52" rx="14" fill="url(#grad)" filter="url(#glow)">
    <animate attributeName="opacity"
      values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.35;0.45;0.8;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="6" y="6" width="248" height="52" rx="14" fill="none" stroke="#FFA116" stroke-width="1.5">
    <animate attributeName="opacity"
      values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.35;0.45;0.8;0.9;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
      values="1;1;2.5;2.5;1;1" keyTimes="0;0.35;0.45;0.8;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle"
    font-family="Verdana, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a">LEETCODE</text>
</svg>